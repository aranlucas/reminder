name: PHP contracts

on:
  pull_request:
    paths:
      - '**.php'
      - composer.json
      - composer.lock
      - .github/workflows/php-checks.yml
  push:
    paths:
      - '**.php'
      - composer.json
      - composer.lock
      - .github/workflows/php-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check runtime
        run: |
          php -r 'exit(PHP_VERSION_ID >= 80200 ? 0 : 1);'
      - name: Install locked dependencies without scripts or plugins
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Validate dependency manifest
        run: composer validate --strict
      - name: Lint and exercise offline contracts
        run: composer check
