<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Write and send a text message through your configured messaging gateway.">
  <title>Send a text message · Reminder</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/reminder.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#message-form">Skip to message</a>
  <header class="app-header">
    <div class="page-width"><a class="app-name" href="./">Reminder</a></div>
  </header>
  <main class="page-width">
    <div class="message-layout">
      <section class="introduction" aria-labelledby="page-title">
        <h1 id="page-title">Send a text message</h1>
        <p>Enter a phone number and write your message.</p>
      </section>
      <aside class="gateway-note" aria-label="Before sending">
        <h2>Before sending</h2>
        <p>Make sure your messaging gateway is configured before sending a message.</p>
      </aside>
      <form id="message-form" action="smtpgmail.php" method="post" aria-labelledby="page-title">
        <div class="field">
          <label for="recipient">Phone number <span class="required-label">(required)</span></label>
          <input id="recipient" class="form-control" type="tel" inputmode="tel" autocomplete="tel" name="email" required aria-describedby="recipient-help">
          <p class="field-help" id="recipient-help">Use the number format expected by your messaging gateway.</p>
        </div>
        <div class="field">
          <label for="message">Message <span class="required-label">(required)</span></label>
          <textarea id="message" class="form-control" name="message" rows="6" required aria-describedby="message-help"></textarea>
          <p class="field-help" id="message-help">This message is sent when you submit the form.</p>
        </div>
        <button class="btn btn-primary send-button" type="submit">Send message</button>
      </form>
    </div>
  </main>
</body>
</html>
